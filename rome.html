<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ITER ROMANUM · 내 주머니 속 로마</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#EDE6D3;
    --card:#FBF8F0;
    --ink:#2A2118;
    --ink-soft:#5B5142;
    --purple:#4B1D3F;
    --purple-deep:#341229;
    --gold:#B8934A;
    --gold-soft:#DCC58E;
    --brick:#8B3A2B;
    --line:#D8CDB2;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--stone);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--stone);
    position:relative;
    overflow-x:hidden;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(184,147,74,0.10), transparent 40%),
      radial-gradient(circle at 90% 92%, rgba(75,29,63,0.08), transparent 45%);
  }

  /* ===== HEADER / ROAD PROGRESS ===== */
  header{
    padding:22px 20px 16px;
    background:linear-gradient(180deg, var(--purple) 0%, var(--purple-deep) 100%);
    color:var(--stone);
    border-radius:0 0 22px 22px;
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
  }
  .eyebrow{
    font-family:'Inter', sans-serif;
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold-soft);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  h1.pagetitle{
    font-family:'Cinzel', serif;
    font-size:22px;
    letter-spacing:1px;
    margin-top:6px;
    font-weight:600;
  }
  .subtitle{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--gold-soft);
    margin-top:2px;
    opacity:0.85;
  }

  .via-track{
    margin-top:18px;
    position:relative;
    padding:0 4px;
  }
  .via-line{
    position:relative;
    height:3px;
    background:rgba(255,255,255,0.18);
    border-radius:2px;
    margin:0 6px;
  }
  .via-fill{
    position:absolute;
    left:0; top:0; height:100%;
    background:linear-gradient(90deg, var(--gold-soft), var(--gold));
    border-radius:2px;
    transition:width .5s ease;
    width:12.5%;
  }
  .milestones{
    display:flex;
    justify-content:space-between;
    margin-top:-9px;
  }
  .milestone{
    width:19px; height:19px;
    border-radius:50%;
    background:var(--purple-deep);
    border:2px solid rgba(255,255,255,0.35);
    font-family:'Inter', sans-serif;
    font-size:9px;
    font-weight:700;
    color:rgba(255,255,255,0.55);
    display:flex; align-items:center; justify-content:center;
    transition:all .3s ease;
  }
  .milestone.done{
    background:var(--gold);
    border-color:var(--gold-soft);
    color:var(--purple-deep);
  }
  .milestone.current{
    background:var(--stone);
    border-color:var(--gold);
    color:var(--purple-deep);
    transform:scale(1.15);
    box-shadow:0 0 0 3px rgba(184,147,74,0.35);
  }

  .stat-row{
    display:flex;
    justify-content:space-between;
    margin-top:16px;
    font-family:'Inter', sans-serif;
  }
  .stat{
    text-align:left;
  }
  .stat .num{
    font-family:'Cinzel', serif;
    font-size:17px;
    color:var(--stone);
  }
  .stat .label{
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold-soft);
    opacity:0.8;
  }
  .badge{
    font-family:'Inter', sans-serif;
    font-size:10px;
    letter-spacing:1px;
    background:rgba(184,147,74,0.18);
    border:1px solid var(--gold);
    color:var(--gold-soft);
    padding:5px 10px;
    border-radius:20px;
    align-self:center;
  }

  /* ===== CARD ===== */
  main{
    padding:20px 18px 40px;
  }
  .card{
    display:none;
    animation:fadeIn .35s ease;
  }
  .card.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .statio{
    font-family:'Inter', sans-serif;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--brick);
    font-weight:600;
  }
  h2.title-kr{
    font-family:'Cinzel', serif;
    font-size:24px;
    color:var(--purple);
    margin-top:4px;
    line-height:1.25;
  }
  .title-en{
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-size:16px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .photo-slot{
    margin-top:16px;
    aspect-ratio: 4/3;
    position:relative;
    border-radius:var(--radius);
    border:1.5px dashed var(--gold);
    background:repeating-linear-gradient(135deg, rgba(184,147,74,0.06) 0 10px, rgba(184,147,74,0.02) 10px 20px);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:4px;
    color:var(--ink-soft);
    font-family:'Inter', sans-serif;
    font-size:12px;
    text-align:center;
    padding:14px;
  }
  .photo-slot .icon{ font-size:26px; opacity:.55; }

  .audio-bar{
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .play-btn{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--purple);
    color:var(--gold-soft);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    font-size:13px;
  }
  .audio-meta{ font-family:'Inter', sans-serif; flex:1; }
  .audio-meta .t{ font-size:12px; font-weight:600; color:var(--ink); }
  .audio-meta .track{
    margin-top:5px; height:4px; background:var(--line); border-radius:2px; position:relative;
  }
  .audio-meta .track span{
    position:absolute; left:0; top:0; height:100%; width:0%; background:var(--brick); border-radius:2px;
  }
  .audio-lang{
    font-family:'Inter', sans-serif;
    font-size:9px; letter-spacing:.5px;
    background:rgba(139,58,43,0.1); color:var(--brick);
    padding:3px 7px; border-radius:8px;
  }

  .quick10{
    margin-top:16px;
    background:var(--purple);
    color:var(--stone);
    border-radius:var(--radius);
    padding:14px 16px;
    position:relative;
  }
  .quick10::before{
    content:"10초 만에 보기";
    font-family:'Inter', sans-serif;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold-soft);
    display:block;
    margin-bottom:6px;
  }
  .quick10 p{
    font-family:'Cinzel', serif;
    font-size:15px;
    line-height:1.5;
    font-weight:600;
  }

  .section{
    margin-top:18px;
  }
  .section .h{
    font-family:'Inter', sans-serif;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--brick);
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
  }
  .section .h::before{
    content:"";
    width:14px; height:2px;
    background:var(--gold);
    display:inline-block;
  }
  .section p{
    font-size:16px;
    line-height:1.65;
    color:var(--ink);
  }
  .en{
    font-style:italic;
    color:var(--ink-soft);
    font-size:14px;
    margin-top:6px;
    line-height:1.55;
    border-left:2px solid var(--gold);
    padding-left:10px;
  }

  .behind{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--brick);
    border-radius:0 var(--radius) var(--radius) 0;
    padding:14px 16px;
  }

  .italian-tip{
    margin-top:18px;
    background:linear-gradient(135deg, #F4EBD8, #EDDFC0);
    border-radius:var(--radius);
    padding:14px 16px;
    border:1px solid var(--gold);
  }
  .italian-tip .h{ color:var(--purple); }
  .italian-tip .h::before{ background:var(--purple); }
  .italian-phrase{
    font-family:'Cinzel', serif;
    font-size:17px;
    color:var(--purple);
    margin-top:2px;
  }
  .italian-mean{
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:3px;
  }

  .phototip{
    margin-top:14px;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .phototip .ic{ font-size:18px; margin-top:1px; }
  .phototip p{ font-size:14px; line-height:1.55; color:var(--ink-soft); }

  .quote-box{
    margin-top:18px;
    text-align:center;
    padding:16px 10px;
    position:relative;
  }
  .quote-box::before, .quote-box::after{
    content:"❧";
    color:var(--gold);
    font-size:14px;
    display:block;
  }
  .quote-box p{
    font-family:'Cinzel', serif;
    font-size:14px;
    color:var(--purple);
    margin:8px 0;
    letter-spacing:.3px;
  }

  .next-preview{
    margin-top:26px;
    background:var(--purple-deep);
    color:var(--stone);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .next-preview .lab{
    font-family:'Inter', sans-serif;
    font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--gold-soft); opacity:.8;
  }
  .next-preview .nm{
    font-family:'Cinzel', serif;
    font-size:16px;
    margin-top:3px;
  }
  .next-preview .arrow{ color:var(--gold); font-size:20px; }

  /* ===== NAV ===== */
  .nav{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  .nav button{
    flex:1;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    padding:13px;
    border-radius:var(--radius);
    border:none;
    cursor:pointer;
  }
  .btn-prev{
    background:transparent;
    border:1.5px solid var(--purple) !important;
    color:var(--purple);
  }
  .btn-next{
    background:var(--purple);
    color:var(--stone);
  }
  .btn-next:disabled, .btn-prev:disabled{
    opacity:0.35;
    cursor:default;
  }

  .final-badge{
    margin-top:20px;
    text-align:center;
    padding:20px;
    background:var(--card);
    border:1.5px solid var(--gold);
    border-radius:var(--radius);
  }
  .final-badge .crest{ font-size:30px; }
  .final-badge h3{
    font-family:'Cinzel', serif;
    color:var(--purple);
    font-size:17px;
    margin-top:8px;
  }
  .final-badge p{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
    line-height:1.5;
  }
</style>
</head>
<body>
<div class="phone">

  <header>
    <div class="eyebrow">
      <span>ITER ROMANUM</span>
      <span class="badge" id="badgeText">STATIO 1 / 8</span>
    </div>
    <h1 class="pagetitle">내 주머니 속 로마</h1>
    <div class="subtitle">이터 로마눔 · 로마로 가는 하루의 여정</div>

    <button id="langToggle" onclick="toggleLang()"
      style="margin-top:12px; font-family:'Inter',sans-serif; font-size:11px; font-weight:600; letter-spacing:.5px;
             background:rgba(184,147,74,0.15); border:1px solid var(--gold); color:var(--gold-soft);
             padding:7px 12px; border-radius:20px; cursor:pointer;">
      🇰🇷 한국어 음성·영상으로 보기
    </button>

    <div class="via-track">
      <div class="via-line"><div class="via-fill" id="viaFill"></div></div>
      <div class="milestones" id="milestones"></div>
    </div>

    <div class="stat-row">
      <div class="stat">
        <div class="num" id="distNum">0.0 km</div>
        <div class="label">도보 이동거리 (예상)</div>
      </div>
      <div class="stat" style="text-align:right">
        <div class="num" id="stopNum">성 베드로 대성당</div>
        <div class="label">현재 스팟</div>
      </div>
    </div>
  </header>

  <main id="cardWrap"></main>

  <div style="padding:0 18px 30px">
    <div class="nav">
      <button class="btn-prev" id="prevBtn">← 이전</button>
      <button class="btn-next" id="nextBtn">다음 →</button>
    </div>
  </div>

</div>

  {

      }

    dist:0.0,
    quick:"미켈란젤로가 설계했지만, 정작 그는 완성을 보지 못했다",
    overviewKr:"돔은 미켈란젤로가 설계했지만 완공 전에 세상을 떠났고, 후배 건축가 자코모 델라 포르타가 원래 도면보다 더 뾰족하고 높게 바꿔 완성했어요. 높이 136m로 지금도 세계에서 가장 높은 돔이에요.",

let idx = 0;
let lang = 'en';

function toggleLang(){
  lang = lang === 'en' ? 'ko' : 'en';
  document.getElementById('langToggle').textContent =
    lang === 'en' ? '🇰🇷 한국어 음성·영상으로 보기' : '🇬🇧 영어(English)로 보기';
  renderCard();
}

function audioBlockHTML(s, suffix, label){
  const enFile = suffix === '2' ? s.audioEn2 : s.audioEn;
  const koFile = suffix === '2' ? s.audioKo2 : s.audioKo;
  const src = lang === 'ko' ? koFile : enFile;
  const id = 'audio_' + idx + '_' + suffix;
  return `
    <div class="audio-bar" id="${id}_row">
      <div class="play-btn" id="${id}_btn" onclick="toggleAudio('${id}')">▶</div>
      <div class="audio-meta">
        <div class="t">오디오 가이드 · ${label} (${lang==='ko' ? '한국어' : 'EN'})</div>
        <div class="track"><span id="${id}_bar" style="width:0%"></span></div>
      </div>
      <div class="audio-lang">${lang==='ko' ? 'KO' : 'EN'}</div>
      <audio id="${id}" src="${src}" preload="none" style="display:none"
             onplay="onAudioPlay('${id}')" onpause="onAudioPauseEnd('${id}')" onended="onAudioPauseEnd('${id}')"
             ontimeupdate="onAudioTime('${id}')" onerror="onAudioError('${id}')"></audio>
    </div>
  `;
}

function miniAudioHTML(src, id, label){
  if(!src) return '';
  return `
    <div id="${id}_row" style="display:flex; align-items:center; gap:8px; margin-top:8px;">
      <div class="play-btn" id="${id}_btn" onclick="toggleAudio('${id}')" style="width:26px;height:26px;font-size:10px;">▶</div>
      <div style="font-family:'Inter',sans-serif; font-size:11px; color:var(--brick);">${label}</div>
      <audio id="${id}" src="${src}" preload="none" style="display:none"
             onplay="onAudioPlay('${id}')" onpause="onAudioPauseEnd('${id}')" onended="onAudioPauseEnd('${id}')"
             onerror="onAudioError('${id}')"></audio>
    </div>
  `;
}

function toggleAudio(id){
  const el = document.getElementById(id);
  if(!el) return;
  document.querySelectorAll('audio').forEach(a=>{ if(a.id !== id && !a.paused){ a.pause(); } });
  if(el.paused){ el.play().catch(()=>{}); } else { el.pause(); }
}
function onAudioPlay(id){ const b = document.getElementById(id+'_btn'); if(b) b.textContent = '⏸'; }
function onAudioPauseEnd(id){ const b = document.getElementById(id+'_btn'); if(b) b.textContent = '▶'; }
function onAudioTime(id){
  const el = document.getElementById(id), bar = document.getElementById(id+'_bar');
  if(el && bar && el.duration){ bar.style.width = (el.currentTime/el.duration*100) + '%'; }
}
function onAudioError(id){
  const row = document.getElementById(id+'_row');
  if(row) row.innerHTML = '<div style="font-family:\'Inter\',sans-serif;font-size:12px;color:var(--ink-soft);padding:8px 2px;">🔇 아직 이 언어의 음성 파일이 없어요</div>';
}

function renderMilestones(){
  const wrap = document.getElementById('milestones');
  wrap.innerHTML = '';
  stops.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'milestone' + (i < idx ? ' done' : '') + (i === idx ? ' current' : '');
    d.textContent = i+1;
    wrap.appendChild(d);
  });
}

      <div class="section">
        <div class="h">꼭 봐야 할 작품</div>
        ${s.artworks.map((a,i) => `
          <div class="behind" style="margin-bottom:10px;">
            <div style="font-family:'Cinzel',serif; font-size:14px; color:var(--purple);">${a.nameKr}</div>
            <div style="font-family:'Inter',sans-serif; font-size:10px; color:var(--brick); letter-spacing:.5px; margin-top:2px;">${a.where}</div>
            <p style="margin-top:6px;">${a.descKr}</p>
            <p class="en">${a.descEn}</p>
            ${lang==='ko' ? miniAudioHTML(a.audioKo, 'art_'+idx+'_'+i, '🔊 한국어 음성') : ''}
          </div>
        `).join('')}
      </div>` : ''}

      <div class="italian-tip">
        <div class="h">이탈리아어 한마디</div>
        <div class="italian-phrase">${s.italianPhrase}</div>
        <div class="italian-mean">${s.italianMean}</div>
      </div>

      <div class="phototip">
        <div class="ic">📷</div>
        <p><strong>사진 팁.</strong> ${s.photoTip}</p>
      </div>

      ${idx < stops.length - 1 ? `
      <div class="next-preview">
        <div>
          <div class="lab">다음 스타티오</div>
          <div class="nm">${stops[idx+1].titleKr}</div>
        </div>
        <div class="arrow">→</div>
      </div>` : `
      <div class="final-badge">
        <div class="crest">🏅</div>
        <h3>Roma Explorata</h3>
        <p>바티칸에서 몬티까지, 하루 동안 로마의 8개 장소를 모두 돌았어요.</p>
      </div>`}
    </div>
  `;

  document.getElementById('badgeText').textContent = `STATIO ${idx+1} / ${stops.length}`;
  document.getElementById('stopNum').textContent = s.titleKr;
  document.getElementById('distNum').textContent = s.dist.toFixed(1) + ' km';
  document.getElementById('viaFill').style.width = ((idx+1)/stops.length*100) + '%';
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === stops.length - 1;
  document.getElementById('nextBtn').textContent = idx === stops.length - 1 ? '완료 ✓' : '다음 →';

  renderMilestones();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(idx>0){ idx--; renderCard(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(idx<stops.length-1){ idx++; renderCard(); }
});

renderCard();
</script>
</body>
</html>
